[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hospital-assistant-tech-challenge"
version = "0.1.0"
description = "Preparação reproduzível de dados para assistente hospitalar acadêmico"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
html = ["beautifulsoup4==4.14.3"]

[project.scripts]
hospital-data = "hospital_assistant.cli:main"
hospital-train = "hospital_assistant.finetuning.cli:main"
hospital-rag = "hospital_assistant.rag.cli:main"
hospital-workflow = "hospital_assistant.workflow.cli:main"
hospital-assess = "hospital_assistant.assessment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
